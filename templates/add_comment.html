<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить комментарий к {{ post.title }}</title>
</head>
<body>
    <h1>Добавить комментарий к "{{ post.title }}"</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>

    <li><a href="{{link}}{{post.get_absolute_url}}">{{post.title}}</a></li>
</body>
</html>
